server:
  port: ${PORT:8081}

spring:
  application:
    name: digitalbot-backend
  datasource:
    url: jdbc:h2:file:./data/digitalbot;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:digitalbot-dev-secret-change-me}

xai:
  api-key: ${XAI_API_KEY:}
  base-url: ${XAI_BASE_URL:https://api.x.ai/v1}
  model: ${XAI_MODEL:grok-4.5}

logging:
  level:
    com.digitalbot: INFO
