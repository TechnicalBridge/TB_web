# =============================================================================
#  frontend — el portal del deudor y de la empresa (React)
# =============================================================================
#  Corre solo si cambio su carpeta. Compila el portal y revisa sus
#  dependencias: rompe ante algo de severidad alta o critica. Lo moderado lo
#  revisa Dependabot con un pull request, sin bloquear a todo el equipo.
# =============================================================================
name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construir:
    name: Build y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dependencias vulnerables
        run: npm audit --audit-level=high
