# =============================================================================
#  ms-auth — el acceso: codigos, enlaces y sesiones
# =============================================================================
#  Corre solo si cambio su carpeta (o este workflow, o el reutilizable): un
#  cambio en el portal no vuelve a probar los servicios Java.
# =============================================================================
name: ms-auth

on:
  push:
    branches: [main]
    paths: ['ms-auth/**', '.github/workflows/ms-auth.yml', '.github/workflows/java.yml']
  pull_request:
    paths: ['ms-auth/**', '.github/workflows/ms-auth.yml', '.github/workflows/java.yml']

#  Un push nuevo a la misma rama cancela la corrida anterior, que ya no sirve.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    uses: ./.github/workflows/java.yml
    with:
      modulo: ms-auth
