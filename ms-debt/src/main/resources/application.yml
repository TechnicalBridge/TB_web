server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-debt
  jmx:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:tb_debt}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago
    username: ${DB_USER:tbridge}
    password: ${DB_PASSWORD:tbridge_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # El esquema lo pone Flyway. Con 'validate' el servicio no arranca si
      # las entidades y las tablas dejaron de calzar.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${EVENTS_RABBIT:false}
        missing-queues-fatal: false
    connection-timeout: 2000

jwt:
  secret: ${JWT_SECRET:tbridge-dev-secret-change-me-32chars}

app:
  internal-key: ${INTERNAL_KEY:tbridge-internal-dev}
  # ms-auth: para emitir el codigo de acceso cuando el acreedor lo pide.
  auth-url: ${AUTH_URI:http://127.0.0.1:8081}
  eventos:
    # Cada cuanto se revisa la bandeja de eventos por entregar (contrato 3).
    intervalo-ms: ${EVENTOS_INTERVALO_MS:15000}

events:
  rabbit: ${EVENTS_RABBIT:false}

logging:
  level:
    com.tbridge: INFO
