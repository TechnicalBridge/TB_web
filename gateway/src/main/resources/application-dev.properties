# =============================================================================
#  Perfil dev: para programar. Se activa con SPRING_PROFILES_ACTIVE=dev
#      .\mvnw.cmd -pl gateway spring-boot:run "-Dspring-boot.run.profiles=dev"
# =============================================================================

#  Cada ruta que se resuelve y a donde se manda.
logging.level.com.tbridge.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
management.endpoint.health.show-details=always

#  Un cupo holgado: al programar se recarga mucho la misma pagina.
ratelimit.global-capacity=1000
