# =============================================================================
#  Perfil dev: para programar. Se activa con SPRING_PROFILES_ACTIVE=dev
#      .\mvnw.cmd -pl ms-auth spring-boot:run "-Dspring-boot.run.profiles=dev"
# =============================================================================

logging.level.com.tbridge=DEBUG
#  Las consultas que hace Hibernate, formateadas.
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

#  El detalle de la salud (la base, el disco) a la vista.
management.endpoint.health.show-details=always
