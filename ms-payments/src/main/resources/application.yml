server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-payments
  jmx:
    enabled: false
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:tb_payments}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago
    username: ${DB_USER:tbridge}
    password: ${DB_PASSWORD:tbridge_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # El esquema lo pone Flyway. 'validate' hace que el servicio NO arranque
      # si las entidades y las tablas dejaron de calzar, en vez de alterar la
      # base en silencio como hacia 'update'.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        auto-startup: false
    connection-timeout: 2000

jwt:
  secret: ${JWT_SECRET:tbridge-dev-secret-change-me-32chars}

app:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  internal-key: ${INTERNAL_KEY:tbridge-internal-dev}
  webhook-secret: ${WEBHOOK_SECRET:tbridge-webhook-dev}
  debt-url: ${DEBT_URI:http://127.0.0.1:8083}

events:
  rabbit: ${EVENTS_RABBIT:false}

logging:
  level:
    com.tbridge: INFO
