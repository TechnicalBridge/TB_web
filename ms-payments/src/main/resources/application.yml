server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-payments
  jmx:
    enabled: false
  datasource:
    url: jdbc:h2:file:./data/ms-payments;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        auto-startup: false
    connection-timeout: 2000

jwt:
  secret: ${JWT_SECRET:tbridge-dev-secret-change-me-32chars}

app:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  internal-key: ${INTERNAL_KEY:tbridge-internal-dev}
  webhook-secret: ${WEBHOOK_SECRET:tbridge-webhook-dev}
  debt-url: ${DEBT_URI:http://127.0.0.1:8083}

events:
  rabbit: ${EVENTS_RABBIT:false}

logging:
  level:
    com.tbridge: INFO
