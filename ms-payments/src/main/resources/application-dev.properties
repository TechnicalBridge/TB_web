# =============================================================================
#  Perfil dev: para programar. Se activa con SPRING_PROFILES_ACTIVE=dev
#      .\mvnw.cmd -pl ms-payments spring-boot:run "-Dspring-boot.run.profiles=dev"
# =============================================================================

logging.level.com.tbridge=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
management.endpoint.health.show-details=always

#  Los avisos a ms-debt salen cada dos segundos en vez de quince: al probar un
#  pago a mano, el saldo se actualiza casi al instante.
app.dispatch-interval-ms=2000
